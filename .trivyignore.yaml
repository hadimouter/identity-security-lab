# Dérogations Trivy — DATÉES et JUSTIFIÉES. Politique : docs/security.md.
#
# Trois règles, sans exception :
#
#   1. Une dérogation cible un identifiant précis, jamais un chemin ou une
#      catégorie entière. On accepte un risque nommé, pas une zone d'ombre.
